[project]
name = "selfpi"
version = "0.1.0"
description = "Self-Maintaining APIs — watch specs, find call sites, open fix PRs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pymongo>=4.10.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "PyJWT[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mongomock>=4.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
selfpi-api = "api.main:run"
selfpi-seed = "db.seed:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "db*",
  "diff*",
  "watcher*",
  "scanner*",
  "patcher*",
  "languages*",
  "llm*",
  "pipeline*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
